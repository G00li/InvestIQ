version: '3.8'

services:
  ollama:
    build:
      context: .
      dockerfile: llama.Dockerfile
    container_name: investiq_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - investiq_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models

networks:
  investiq_network:
    external: true

volumes:
  ollama_data:
    external: true 