version: '3'

services:
  app:
    build: .
    container_name: market_ai_backend
    ports:
      - "8000:8000"
    env_file:
      - .env  # Usa as variáveis do arquivo .env
    depends_on:
      - redis
    volumes:
      - .:/app

  redis:
    image: "redis:alpine"
    container_name: market_ai_redis
    ports:
      - "6379:6379"
