version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: investiq_backend
    ports:
      - "8000:8000"
      - "11434:11434"
    volumes:
      - ./backend:/app
      - ollama_data:/root/.ollama
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investiq_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development

  redis:
    image: redis:alpine
    container_name: investiq_redis
    ports:
      - "6379:6379"

volumes:
  ollama_data:
